---
layout: default
---
<!-- page.html -->
        <div class="post">
          <header class="post-header">
            <h1 class="post-title">{{ page.title }}</h1>
            <p class="post-description">{{ page.description }}
            {%- if page.github -%}
              <br>
              <a href="{{ page.github }}"><i class="fab fa-github gh-icon"></i></a>
            {%- endif %}
            </p>
          </header>
          <article>
            {{ content }}
          </article>
        </div>
